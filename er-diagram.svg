<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="520" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a">Inventory &amp; Billing Management System — ER Diagram</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>

  <!-- CUSTOMERS table -->
  <g>
    <rect x="40" y="90" width="180" height="150" rx="6" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.5"/>
    <rect x="40" y="90" width="180" height="30" rx="6" fill="#185fa5"/>
    <rect x="40" y="110" width="180" height="10" fill="#185fa5"/>
    <text x="130" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">CUSTOMERS</text>
    <text x="55" y="140" font-family="Arial, sans-serif" font-size="12" fill="#0c447c">CustomerID (PK)</text>
    <text x="55" y="160" font-family="Arial, sans-serif" font-size="12" fill="#0c447c">CustomerName</text>
    <text x="55" y="180" font-family="Arial, sans-serif" font-size="12" fill="#0c447c">Phone</text>
  </g>

  <!-- SALES table -->
  <g>
    <rect x="360" y="60" width="200" height="190" rx="6" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.5"/>
    <rect x="360" y="60" width="200" height="30" rx="6" fill="#0f6e56"/>
    <rect x="360" y="80" width="200" height="10" fill="#0f6e56"/>
    <text x="460" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">SALES</text>
    <text x="375" y="110" font-family="Arial, sans-serif" font-size="12" fill="#085041">SaleID (PK)</text>
    <text x="375" y="130" font-family="Arial, sans-serif" font-size="12" fill="#085041">InvoiceNumber</text>
    <text x="375" y="150" font-family="Arial, sans-serif" font-size="12" fill="#085041">CustomerID (FK)</text>
    <text x="375" y="170" font-family="Arial, sans-serif" font-size="12" fill="#085041">SaleDate</text>
    <text x="375" y="190" font-family="Arial, sans-serif" font-size="12" fill="#085041">PaymentMethod</text>
    <text x="375" y="210" font-family="Arial, sans-serif" font-size="12" fill="#085041">TotalAmount</text>
  </g>

  <!-- SALEDETAILS table -->
  <g>
    <rect x="360" y="330" width="200" height="150" rx="6" fill="#faece7" stroke="#993c1d" stroke-width="1.5"/>
    <rect x="360" y="330" width="200" height="30" rx="6" fill="#993c1d"/>
    <rect x="360" y="350" width="200" height="10" fill="#993c1d"/>
    <text x="460" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">SALEDETAILS</text>
    <text x="375" y="380" font-family="Arial, sans-serif" font-size="12" fill="#712b13">SaleDetailID (PK)</text>
    <text x="375" y="400" font-family="Arial, sans-serif" font-size="12" fill="#712b13">SaleID (FK)</text>
    <text x="375" y="420" font-family="Arial, sans-serif" font-size="12" fill="#712b13">ProductID (FK)</text>
    <text x="375" y="440" font-family="Arial, sans-serif" font-size="12" fill="#712b13">Quantity</text>
    <text x="375" y="460" font-family="Arial, sans-serif" font-size="12" fill="#712b13">UnitPrice</text>
  </g>

  <!-- PRODUCTS table -->
  <g>
    <rect x="680" y="90" width="180" height="150" rx="6" fill="#faeeda" stroke="#854f0b" stroke-width="1.5"/>
    <rect x="680" y="90" width="180" height="30" rx="6" fill="#854f0b"/>
    <rect x="680" y="110" width="180" height="10" fill="#854f0b"/>
    <text x="770" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">PRODUCTS</text>
    <text x="695" y="140" font-family="Arial, sans-serif" font-size="12" fill="#633806">ProductID (PK)</text>
    <text x="695" y="160" font-family="Arial, sans-serif" font-size="12" fill="#633806">ProductName</text>
    <text x="695" y="180" font-family="Arial, sans-serif" font-size="12" fill="#633806">Price</text>
    <text x="695" y="200" font-family="Arial, sans-serif" font-size="12" fill="#633806">StockQty</text>
  </g>

  <!-- Relationship: CUSTOMERS -> SALES -->
  <line x1="220" y1="150" x2="358" y2="150" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="289" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333333">places (1:N)</text>

  <!-- Relationship: SALES -> SALEDETAILS -->
  <line x1="460" y1="250" x2="460" y2="328" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="530" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333333">contains (1:N)</text>

  <!-- Relationship: PRODUCTS -> SALEDETAILS -->
  <line x1="770" y1="240" x2="560" y2="400" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="660" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333333">sold in (1:N)</text>

  <!-- Legend -->
  <text x="40" y="500" font-family="Arial, sans-serif" font-size="11" fill="#666666">PK = Primary Key   FK = Foreign Key   SaleDetails bridges Sales and Products (many-to-many)</text>
</svg>
